<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <title>NicoOS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px; min-height: 100vh;
      background: radial-gradient(circle at top right, #202b50, #090d18 55%);
      color: #f1f4ff; font-family: system-ui, Arial, sans-serif;
    }
    main { max-width: 780px; margin: 36px auto; }
    h1 { font-size: clamp(38px, 8vw, 56px); margin: 0; letter-spacing: -2px; }
    .accent { color: #9aaaff; }
    .muted { color: #9ba7c2; }
    .panel {
      margin: 28px 0; padding: 26px;
      background: rgba(25, 34, 57, .82);
      border: 1px solid #344264; border-radius: 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,.22);
    }
    #time { font-size: clamp(40px, 10vw, 64px); font-weight: 750; letter-spacing: -2px; }
    .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 12px; }
    a {
      display: block; padding: 18px; border-radius: 16px;
      background: rgba(25, 34, 57, .82); border: 1px solid #344264;
      color: white; text-decoration: none; transition: .2s;
    }
    a:hover { transform: translateY(-2px); border-color: #9aaaff; }
    textarea {
      width: 100%; min-height: 150px; resize: vertical;
      padding: 16px; border-radius: 16px; border: 1px solid #344264;
      background: #111a2d; color: white; font: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>Nico<span class="accent">OS</span></h1>
    <p class="muted">Your space. Your shortcuts. Your rules.</p>
    <section class="panel">
      <div id="time">--:--:--</div>
      <p id="date" class="muted"></p>
    </section>
    <h2>Quick launch 🚀</h2>
    <section class="apps">
      <a href="https://www.youtube.com/">▶ YouTube</a>
      <a href="https://open.spotify.com/">♫ Spotify</a>
      <a href="https://www.roblox.com/">◆ Roblox</a>
      <a href="https://github.com/">⌘ GitHub</a>
      <a href="https://mail.google.com/">✉ Gmail</a>
      <a href="https://www.callofduty.com/mobile">🎮 Call of Duty Mobile</a>
    </section>
    <h2>Quick notes 📝</h2>
    <textarea id="notes" placeholder="Write your ideas here..."></textarea>
    <p class="muted">Notes are saved in this browser on this device.</p>
  </main>
  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById("time").textContent = now.toLocaleTimeString();
      document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
      });
    }
    updateClock();
    setInterval(updateClock, 1000);
    const notes = document.getElementById("notes");
    notes.value = localStorage.getItem("nicoos-notes") || "";
    notes.addEventListener("input", () => localStorage.setItem("nicoos-notes", notes.value));
  </script>
</body>
</html>
